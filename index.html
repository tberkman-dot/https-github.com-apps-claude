<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlightWatch — Live Flight Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #e6edf3; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: #161b22; border-bottom: 1px solid #30363d; z-index: 1000; flex-shrink: 0; }
        #header h1 { font-size: 18px; font-weight: 700; color: #58a6ff; white-space: nowrap; }
        #search { flex: 1; max-width: 280px; padding: 7px 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; font-size: 14px; outline: none; }
        #search:focus { border-color: #58a6ff; }
        #search::placeholder { color: #6e7681; }
        #refresh-btn { padding: 7px 14px; background: #21262d; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; font-size: 13px; cursor: pointer; }
        #refresh-btn:hover { background: #30363d; }
        #refresh-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        #status { font-size: 12px; color: #6e7681; white-space: nowrap; margin-left: auto; }
        #status.loading { color: #58a6ff; }
        #status.error { color: #f85149; }
        #main { flex: 1; position: relative; overflow: hidden; }
        #map { width: 100%; height: 100%; }
        #loading-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(13,17,23,0.65); z-index: 999; }
        #loading-overlay.hidden { display: none; }
        .spinner { width: 36px; height: 36px; border: 3px solid #30363d; border-top-color: #58a6ff; border-radius: 50%; animation: spin 0.75s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #flight-panel { position: absolute; top: 12px; right: 12px; width: 280px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; z-index: 1000; overflow: hidden; transform: translateX(320px); transition: transform 0.25s ease; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        #flight-panel.open { transform: translateX(0); }
        #panel-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: #21262d; border-bottom: 1px solid #30363d; }
        #panel-callsign { font-size: 20px; font-weight: 700; color: #58a6ff; letter-spacing: 1.5px; }
        #panel-close { background: none; border: none; color: #6e7681; font-size: 16px; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
        #panel-close:hover { color: #e6edf3; background: #30363d; }
        #panel-body { padding: 12px 14px; }
        .detail-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #21262d; font-size: 13px; }
        .detail-row:last-child { border-bottom: none; }
        .detail-label { color: #6e7681; text-transform: uppercase; font-size: 10px; letter-spacing: 0.8px; }
        .detail-value { color: #e6edf3; font-weight: 500; }
        .detail-value.climbing { color: #3fb950; }
        .detail-value.descending { color: #f85149; }
        .detail-value.on-ground { color: #d29922; }
        #countdown { font-size: 11px; color: #6e7681; padding: 8px 14px; border-top: 1px solid #30363d; text-align: center; }
        .leaflet-control-attribution { background: rgba(13,17,23,0.8) !important; color: #6e7681 !important; }
        .leaflet-control-attribution a { color: #58a6ff !important; }
        .plane-tooltip { background: rgba(22,27,34,0.92); border: 1px solid #30363d; color: #e6edf3; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 4px; box-shadow: none; }
        .leaflet-tooltip.plane-tooltip::before { border-top-color: #30363d; }
    </style>
</head>
<body>
<div id="header">
    <h1>✈ FlightWatch</h1>
    <input type="text" id="search" placeholder="Filter by callsign…" autocomplete="off" spellcheck="false" />
    <button id="refresh-btn">Refresh</button>
    <span id="status">Initializing…</span>
</div>
<div id="main">
    <div id="map"></div>
    <div id="loading-overlay"><div class="spinner"></div></div>
    <div id="flight-panel">
        <div id="panel-header">
            <span id="panel-callsign">—</span>
            <button id="panel-close">✕</button>
        </div>
        <div id="panel-body"></div>
        <div id="countdown"></div>
    </div>
</div>
<script>
const REFRESH_MS = 60000;
const TIMEOUT_MS = 30000;

const SAMPLE_FLIGHTS = [
    { hex:"a59519", flight:"UAL123", lat:41.88, lon:-87.63, alt_baro:35000, gs:450, track:270, baro_rate:0,   squawk:"1200", on_ground:false },
    { hex:"a40658", flight:"DAL456", lat:44.98, lon:-93.21, alt_baro:28000, gs:380, track:180, baro_rate:-700, squawk:"2644", on_ground:false },
    { hex:"a58672", flight:"AAL789", lat:25.77, lon:-80.19, alt_baro:38000, gs:490, track:90,  baro_rate:500,  squawk:"3152", on_ground:false },
    { hex:"a12345", flight:"SWA234", lat:39.74, lon:-104.98,alt_baro:30000, gs:420, track:315, baro_rate:0,   squawk:"1234", on_ground:false },
    { hex:"a67890", flight:"JBU501", lat:34.05, lon:-118.24,alt_baro:25000, gs:360, track:45,  baro_rate:1000, squawk:"4521", on_ground:false },
    { hex:"a11111", flight:"FDX890", lat:29.95, lon:-90.07, alt_baro:20000, gs:400, track:135, baro_rate:-600, squawk:"5623", on_ground:false },
    { hex:"a22222", flight:"UPS321", lat:37.77, lon:-122.45,alt_baro:18000, gs:340, track:225, baro_rate:200,  squawk:"7700", on_ground:false },
    { hex:"a33333", flight:"N12345", lat:42.36, lon:-71.06, alt_baro:3000,  gs:145, track:60,  baro_rate:0,   squawk:"1200", on_ground:false },
    { hex:"a44444", flight:"SKW991", lat:33.45, lon:-112.07,alt_baro:36000, gs:460, track:300, baro_rate:-200, squawk:"2100", on_ground:false },
    { hex:"a55555", flight:"EJA100", lat:33.75, lon:-84.39, alt_baro:40000, gs:510, track:150, baro_rate:0,   squawk:"3300", on_ground:false },
];

let map, flightData = {}, selectedHex = null, refreshTimer, countdownTimer, nextRefresh;

function initMap() {
    map = L.map('map').setView([39.5, -98.35], 5);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com">CARTO</a>',
        maxZoom: 18,
    }).addTo(map);
    map.on('moveend', fetchFlights);
    map.on('click', () => { if (document.getElementById('flight-panel').classList.contains('open')) closePanel(); });
    fetchFlights();
}

function planeIconHTML(track, selected) {
    const color = selected ? '#ffd700' : '#58a6ff';
    const glow  = selected ? 'drop-shadow(0 0 5px rgba(255,215,0,0.8))' : 'none';
    return `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28" style="filter:${glow};display:block;"><g transform="rotate(${track ?? 0},14,14)"><polygon points="14,2 10,14 4,14 6,17 11,17 9,26 14,24 19,26 17,17 22,17 24,14 18,14" fill="${color}" stroke="rgba(0,0,0,0.45)" stroke-width="1"/></g></svg>`;
}

function makePlaneIcon(track, selected) {
    return L.divIcon({ html: planeIconHTML(track, selected), className: '', iconSize: [28,28], iconAnchor: [14,14] });
}

async function fetchFlights() {
    const center = map.getCenter();
    const bounds = map.getBounds();
    const latSpan = bounds.getNorth() - bounds.getSouth();
    const lonSpan = bounds.getEast()  - bounds.getWest();
    const distNm  = Math.round(Math.min(Math.max(latSpan, lonSpan) * 55, 250));
    const url     = `/.netlify/functions/flights?lat=${center.lat.toFixed(4)}&lon=${center.lng.toFixed(4)}&dist=${distNm}`;

    setStatus('loading', 'Fetching flights…');
    document.getElementById('refresh-btn').disabled = true;
    const controller = new AbortController();
    const timeoutId  = setTimeout(() => controller.abort(), TIMEOUT_MS);
    try {
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (!res.ok) throw new Error(`API error ${res.status}`);
        const data = await res.json();
        const flights = (data.ac || []).filter(a => a.lat != null && a.lon != null);
        renderFlights(flights);
        setStatus('', `${flights.length} flight${flights.length !== 1 ? 's' : ''} • ${new Date().toLocaleTimeString()}`);
    } catch (err) {
        clearTimeout(timeoutId);
        renderFlights(SAMPLE_FLIGHTS);
        setStatus('error', 'Live data unavailable — showing sample flights');
    } finally {
        document.getElementById('refresh-btn').disabled = false;
        document.getElementById('loading-overlay').classList.add('hidden');
        scheduleRefresh();
    }
}

function renderFlights(flights) {
    const searchVal    = document.getElementById('search').value.trim().toUpperCase();
    const visibleHexes = new Set();

    flights.forEach(ac => {
        const hex      = ac.hex;
        const callsign = (ac.flight || '').trim();
        const lat      = ac.lat;
        const lon      = ac.lon;
        if (!lat || !lon) return;
        if (searchVal && !callsign.toUpperCase().includes(searchVal) && !hex.toUpperCase().includes(searchVal)) return;

        visibleHexes.add(hex);
        const track      = ac.track;
        const isSelected = hex === selectedHex;

        if (flightData[hex]?.marker) {
            flightData[hex].marker.setLatLng([lat, lon]);
            flightData[hex].marker.setIcon(makePlaneIcon(track, isSelected));
            flightData[hex].ac = ac;
        } else {
            const marker = L.marker([lat, lon], { icon: makePlaneIcon(track, isSelected) });
            marker.bindTooltip(callsign || hex.toUpperCase(), { permanent: false, direction: 'top', className: 'plane-tooltip' });
            marker.on('click', e => { L.DomEvent.stopPropagation(e); selectFlight(hex); });
            marker.addTo(map);
            flightData[hex] = { marker, ac };
        }
    });

    Object.keys(flightData).forEach(hex => {
        if (!visibleHexes.has(hex)) {
            flightData[hex].marker.remove();
            delete flightData[hex];
            if (hex === selectedHex) closePanel();
        }
    });

    if (selectedHex && flightData[selectedHex]) renderPanel(selectedHex);
}

function selectFlight(hex) {
    if (selectedHex && flightData[selectedHex]) {
        const prev = flightData[selectedHex];
        prev.marker.setIcon(makePlaneIcon(prev.ac.track, false));
    }
    selectedHex = hex;
    if (flightData[hex]) flightData[hex].marker.setIcon(makePlaneIcon(flightData[hex].ac.track, true));
    renderPanel(hex);
}

function renderPanel(hex) {
    const entry = flightData[hex]; if (!entry) return;
    const ac       = entry.ac;
    const callsign = (ac.flight || '').trim() || ac.hex.toUpperCase();
    const onGround = ac.on_ground || ac.alt_baro === 'ground';
    const altFt    = !onGround && ac.alt_baro != null ? Number(ac.alt_baro).toLocaleString() + ' ft' : 'N/A';
    const speedKt  = ac.gs != null ? Math.round(ac.gs) + ' kts' : 'N/A';
    const heading  = ac.track != null ? Math.round(ac.track) + '°' : 'N/A';

    let vertLabel = 'Level', vertClass = '';
    const vr = ac.baro_rate;
    if (vr != null) {
        if (vr >  100) { vertLabel = '▲ Climbing';   vertClass = 'climbing';   }
        if (vr < -100) { vertLabel = '▼ Descending'; vertClass = 'descending'; }
    }

    const rows = [
        ['ICAO24',   ac.hex.toUpperCase(),                    ''],
        ['Altitude', onGround ? '—' : altFt,  onGround ? 'on-ground' : ''],
        ['Speed',    onGround ? '—' : speedKt, onGround ? 'on-ground' : ''],
        ['Heading',  heading,                                  ''],
        ['Vertical', onGround ? 'On Ground' : vertLabel, onGround ? 'on-ground' : vertClass],
        ['Squawk',   ac.squawk || 'N/A',                      ''],
    ];

    document.getElementById('panel-callsign').textContent = callsign;
    document.getElementById('panel-body').innerHTML = rows.map(([label, value, cls]) =>
        `<div class="detail-row"><span class="detail-label">${label}</span><span class="detail-value ${cls}">${value}</span></div>`
    ).join('');
    document.getElementById('flight-panel').classList.add('open');
}

function closePanel() {
    document.getElementById('flight-panel').classList.remove('open');
    if (selectedHex && flightData[selectedHex])
        flightData[selectedHex].marker.setIcon(makePlaneIcon(flightData[selectedHex].ac.track, false));
    selectedHex = null;
}

function scheduleRefresh() {
    clearTimeout(refreshTimer); clearInterval(countdownTimer);
    nextRefresh = Date.now() + REFRESH_MS;
    countdownTimer = setInterval(() => {
        const secs = Math.max(0, Math.ceil((nextRefresh - Date.now()) / 1000));
        document.getElementById('countdown').textContent = `Auto-refresh in ${secs}s`;
    }, 1000);
    refreshTimer = setTimeout(() => { clearInterval(countdownTimer); fetchFlights(); }, REFRESH_MS);
}

function setStatus(type, msg) { const el = document.getElementById('status'); el.textContent = msg; el.className = type; }

document.getElementById('refresh-btn').addEventListener('click', () => { clearTimeout(refreshTimer); clearInterval(countdownTimer); fetchFlights(); });
document.getElementById('panel-close').addEventListener('click', closePanel);
document.getElementById('search').addEventListener('input', () => { renderFlights(Object.values(flightData).map(d => d.ac)); });

initMap();
</script>
</body>
</html>
