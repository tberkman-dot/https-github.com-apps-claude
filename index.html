<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlightWatch — Live Flight Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #e6edf3; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: #161b22; border-bottom: 1px solid #30363d; z-index: 1000; flex-shrink: 0; }
        #header h1 { font-size: 18px; font-weight: 700; color: #58a6ff; white-space: nowrap; }
        #search { flex: 1; max-width: 280px; padding: 7px 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; font-size: 14px; outline: none; }
        #search:focus { border-color: #58a6ff; }
        #search::placeholder { color: #6e7681; }
        #refresh-btn { padding: 7px 14px; background: #21262d; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; font-size: 13px; cursor: pointer; }
        #refresh-btn:hover { background: #30363d; }
        #refresh-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        #status { font-size: 12px; color: #6e7681; white-space: nowrap; margin-left: auto; }
        #status.loading { color: #58a6ff; }
        #status.error { color: #f85149; }
        #main { flex: 1; position: relative; overflow: hidden; }
        #map { width: 100%; height: 100%; }
        #loading-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(13,17,23,0.65); z-index: 999; }
        #loading-overlay.hidden { display: none; }
        .spinner { width: 36px; height: 36px; border: 3px solid #30363d; border-top-color: #58a6ff; border-radius: 50%; animation: spin 0.75s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #flight-panel { position: absolute; top: 12px; right: 12px; width: 280px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; z-index: 1000; overflow: hidden; transform: translateX(320px); transition: transform 0.25s ease; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        #flight-panel.open { transform: translateX(0); }
        #panel-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: #21262d; border-bottom: 1px solid #30363d; }
        #panel-callsign { font-size: 20px; font-weight: 700; color: #58a6ff; letter-spacing: 1.5px; }
        #panel-close { background: none; border: none; color: #6e7681; font-size: 16px; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
        #panel-close:hover { color: #e6edf3; background: #30363d; }
        #panel-body { padding: 12px 14px; }
        .detail-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #21262d; font-size: 13px; }
        .detail-row:last-child { border-bottom: none; }
        .detail-label { color: #6e7681; text-transform: uppercase; font-size: 10px; letter-spacing: 0.8px; }
        .detail-value { color: #e6edf3; font-weight: 500; }
        .detail-value.climbing { color: #3fb950; }
        .detail-value.descending { color: #f85149; }
        .detail-value.on-ground { color: #d29922; }
        #countdown { font-size: 11px; color: #6e7681; padding: 8px 14px; border-top: 1px solid #30363d; text-align: center; }
        .leaflet-control-attribution { background: rgba(13,17,23,0.8) !important; color: #6e7681 !important; }
        .leaflet-control-attribution a { color: #58a6ff !important; }
        .plane-tooltip { background: rgba(22,27,34,0.92); border: 1px solid #30363d; color: #e6edf3; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 4px; box-shadow: none; }
        .leaflet-tooltip.plane-tooltip::before { border-top-color: #30363d; }
    </style>
</head>
<body>
<div id="header">
    <h1>✈ FlightWatch</h1>
    <input type="text" id="search" placeholder="Filter by callsign…" autocomplete="off" spellcheck="false" />
    <button id="refresh-btn">Refresh</button>
    <span id="status">Initializing…</span>
</div>
<div id="main">
    <div id="map"></div>
    <div id="loading-overlay"><div class="spinner"></div></div>
    <div id="flight-panel">
        <div id="panel-header">
            <span id="panel-callsign">—</span>
            <button id="panel-close">✕</button>
        </div>
        <div id="panel-body"></div>
        <div id="countdown"></div>
    </div>
</div>
<script>
const OPENSKY_BASE = 'https://opensky-network.org/api/states/all';
const REFRESH_MS   = 60000;
const TIMEOUT_MS   = 30000;

const SAMPLE_STATES = [
    ["a59519","UAL123  ","United States",0,0,-87.63,41.88,10668,false,231.0,270.0,0.0,null,11278,"1200",false,0],
    ["a40658","DAL456  ","United States",0,0,-93.21,44.98,8534,false,198.0,180.0,-2.1,null,8700,"2644",false,0],
    ["a58672","AAL789  ","United States",0,0,-80.19,25.77,11582,false,245.0,90.0,1.5,null,11800,"3152",false,0],
    ["a12345","SWA234  ","United States",0,0,-104.98,39.74,9144,false,210.0,315.0,0.0,null,9300,"1234",false,0],
    ["a67890","JBU501  ","United States",0,0,-118.24,34.05,7620,false,185.0,45.0,3.2,null,7800,"4521",false,0],
    ["a11111","FDX890  ","United States",0,0,-90.07,29.95,6096,false,220.0,135.0,-1.8,null,6200,"5623",false,0],
    ["a22222","UPS321  ","United States",0,0,-122.45,37.77,5486,false,195.0,225.0,0.5,null,5600,"7700",false,0],
    ["a33333","N12345  ","United States",0,0,-71.06,42.36,914,false,75.0,60.0,0.0,null,950,"1200",false,0],
    ["a44444","SKW991  ","United States",0,0,-112.07,33.45,10972,false,238.0,300.0,-0.5,null,11100,"2100",false,0],
    ["a55555","EJA100  ","United States",0,0,-84.39,33.75,12192,false,255.0,150.0,0.0,null,12400,"3300",false,0],
];

const F = { ICAO24:0, CALLSIGN:1, COUNTRY:2, TIME_POS:3, LAST_CONTACT:4, LON:5, LAT:6, BARO_ALT:7, ON_GROUND:8, VELOCITY:9, HEADING:10, VERT_RATE:11, GEO_ALT:13, SQUAWK:14 };
let map, flightData = {}, selectedIcao = null, refreshTimer, countdownTimer, nextRefresh;

function initMap() {
    map = L.map('map').setView([39.5, -98.35], 5);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com">CARTO</a>',
        maxZoom: 18,
    }).addTo(map);
    map.on('moveend', fetchFlights);
    map.on('click', () => { if (document.getElementById('flight-panel').classList.contains('open')) closePanel(); });
    fetchFlights();
}

function planeIconHTML(heading, selected) {
    const color = selected ? '#ffd700' : '#58a6ff';
    const glow  = selected ? 'drop-shadow(0 0 5px rgba(255,215,0,0.8))' : 'none';
    return `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28" style="filter:${glow};display:block;"><g transform="rotate(${heading ?? 0},14,14)"><polygon points="14,2 10,14 4,14 6,17 11,17 9,26 14,24 19,26 17,17 22,17 24,14 18,14" fill="${color}" stroke="rgba(0,0,0,0.45)" stroke-width="1"/></g></svg>`;
}

function makePlaneIcon(heading, selected) {
    return L.divIcon({ html: planeIconHTML(heading, selected), className: '', iconSize: [28,28], iconAnchor: [14,14] });
}

async function fetchFlights() {
    const bounds = map.getBounds();
    const params = new URLSearchParams({
        lamin: bounds.getSouth().toFixed(4), lomin: bounds.getWest().toFixed(4),
        lamax: bounds.getNorth().toFixed(4), lomax: bounds.getEast().toFixed(4),
    });
    setStatus('loading', 'Fetching flights…');
    document.getElementById('refresh-btn').disabled = true;
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), TIMEOUT_MS);
    try {
        const res = await fetch(`${OPENSKY_BASE}?${params}`, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (!res.ok) throw new Error(`API error ${res.status}`);
        const data = await res.json();
        const states = data.states || [];
        renderFlights(states);
        const n = states.length;
        setStatus('', `${n} flight${n !== 1 ? 's' : ''} • ${new Date().toLocaleTimeString()}`);
    } catch (err) {
        clearTimeout(timeoutId);
        renderFlights(SAMPLE_STATES);
        setStatus('error', 'Live data unavailable — showing sample flights');
    } finally {
        document.getElementById('refresh-btn').disabled = false;
        document.getElementById('loading-overlay').classList.add('hidden');
        scheduleRefresh();
    }
}

function renderFlights(states) {
    const searchVal = document.getElementById('search').value.trim().toUpperCase();
    const visibleIcaos = new Set();
    states.forEach(state => {
        const icao = state[F.ICAO24], callsign = (state[F.CALLSIGN] || '').trim();
        const lat = state[F.LAT], lon = state[F.LON];
        if (!lat || !lon) return;
        if (searchVal && !callsign.toUpperCase().includes(searchVal) && !icao.toUpperCase().includes(searchVal)) return;
        visibleIcaos.add(icao);
        const heading = state[F.HEADING], isSelected = icao === selectedIcao;
        if (flightData[icao]?.marker) {
            flightData[icao].marker.setLatLng([lat, lon]);
            flightData[icao].marker.setIcon(makePlaneIcon(heading, isSelected));
            flightData[icao].state = state;
        } else {
            const marker = L.marker([lat, lon], { icon: makePlaneIcon(heading, isSelected) });
            marker.bindTooltip(callsign || icao.toUpperCase(), { permanent: false, direction: 'top', className: 'plane-tooltip' });
            marker.on('click', e => { L.DomEvent.stopPropagation(e); selectFlight(icao); });
            marker.addTo(map);
            flightData[icao] = { marker, state };
        }
    });
    Object.keys(flightData).forEach(icao => {
        if (!visibleIcaos.has(icao)) { flightData[icao].marker.remove(); delete flightData[icao]; if (icao === selectedIcao) closePanel(); }
    });
    if (selectedIcao && flightData[selectedIcao]) renderPanel(selectedIcao);
}

function selectFlight(icao) {
    if (selectedIcao && flightData[selectedIcao]) {
        const prev = flightData[selectedIcao];
        prev.marker.setIcon(makePlaneIcon(prev.state[F.HEADING], false));
    }
    selectedIcao = icao;
    if (flightData[icao]) flightData[icao].marker.setIcon(makePlaneIcon(flightData[icao].state[F.HEADING], true));
    renderPanel(icao);
}

function renderPanel(icao) {
    const entry = flightData[icao]; if (!entry) return;
    const s = entry.state, callsign = (s[F.CALLSIGN] || '').trim() || s[F.ICAO24].toUpperCase();
    const onGround = s[F.ON_GROUND];
    const altFt  = s[F.BARO_ALT]  != null ? Math.round(s[F.BARO_ALT]  * 3.28084).toLocaleString() + ' ft' : 'N/A';
    const speedKt = s[F.VELOCITY] != null ? Math.round(s[F.VELOCITY]  * 1.94384) + ' kts' : 'N/A';
    let vertLabel = 'Level', vertClass = '';
    const vr = s[F.VERT_RATE];
    if (vr != null) {
        if (vr >  0.5) { vertLabel = '▲ Climbing';   vertClass = 'climbing';   }
        if (vr < -0.5) { vertLabel = '▼ Descending'; vertClass = 'descending'; }
    }
    const heading = s[F.HEADING] != null ? Math.round(s[F.HEADING]) + '°' : 'N/A';
    const rows = [
        ['Country',  s[F.COUNTRY] || 'Unknown',               ''],
        ['ICAO24',   s[F.ICAO24].toUpperCase(),               ''],
        ['Altitude', onGround ? '—' : altFt,   onGround ? 'on-ground' : ''],
        ['Speed',    onGround ? '—' : speedKt, onGround ? 'on-ground' : ''],
        ['Heading',  heading,                                  ''],
        ['Vertical', onGround ? 'On Ground' : vertLabel, onGround ? 'on-ground' : vertClass],
        ['Squawk',   s[F.SQUAWK] || 'N/A',                    ''],
    ];
    document.getElementById('panel-callsign').textContent = callsign;
    document.getElementById('panel-body').innerHTML = rows.map(([label, value, cls]) =>
        `<div class="detail-row"><span class="detail-label">${label}</span><span class="detail-value ${cls}">${value}</span></div>`
    ).join('');
    document.getElementById('flight-panel').classList.add('open');
}

function closePanel() {
    document.getElementById('flight-panel').classList.remove('open');
    if (selectedIcao && flightData[selectedIcao])
        flightData[selectedIcao].marker.setIcon(makePlaneIcon(flightData[selectedIcao].state[F.HEADING], false));
    selectedIcao = null;
}

function scheduleRefresh() {
    clearTimeout(refreshTimer); clearInterval(countdownTimer);
    nextRefresh = Date.now() + REFRESH_MS;
    countdownTimer = setInterval(() => {
        const secs = Math.max(0, Math.ceil((nextRefresh - Date.now()) / 1000));
        document.getElementById('countdown').textContent = `Auto-refresh in ${secs}s`;
    }, 1000);
    refreshTimer = setTimeout(() => { clearInterval(countdownTimer); fetchFlights(); }, REFRESH_MS);
}

function setStatus(type, msg) { const el = document.getElementById('status'); el.textContent = msg; el.className = type; }

document.getElementById('refresh-btn').addEventListener('click', () => { clearTimeout(refreshTimer); clearInterval(countdownTimer); fetchFlights(); });
document.getElementById('panel-close').addEventListener('click', closePanel);
document.getElementById('search').addEventListener('input', () => { renderFlights(Object.values(flightData).map(d => d.state)); });

initMap();
</script>
</body>
</html>
