<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cross the Road</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1b2a;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 16px 32px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #eee;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 14px;
      text-shadow: 0 2px 16px rgba(0,0,0,0.5);
    }

    .hud {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .hud span {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 4px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      min-width: 60px;
      text-align: center;
    }

    canvas {
      border: 3px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      box-shadow: 0 8px 48px rgba(0,0,0,0.6);
      display: block;
      max-width: 100%;
    }

    .hint {
      margin-top: 10px;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.32);
      letter-spacing: 0.03em;
    }

    /* Mobile D-pad */
    .dpad {
      display: none;
      margin-top: 20px;
      grid-template-columns: repeat(3, 58px);
      grid-template-rows: repeat(2, 58px);
      gap: 8px;
    }

    @media (pointer: coarse), (max-width: 700px) {
      .dpad { display: grid; }
    }

    .dpad button {
      background: rgba(255,255,255,0.1);
      border: 2px solid rgba(255,255,255,0.18);
      color: #fff;
      font-size: 1.6rem;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-user-select: none;
      user-select: none;
      transition: background 0.08s;
    }

    .dpad button:active { background: rgba(255,255,255,0.28); }
    .d-up    { grid-column: 2; grid-row: 1; }
    .d-left  { grid-column: 1; grid-row: 2; }
    .d-down  { grid-column: 2; grid-row: 2; }
    .d-right { grid-column: 3; grid-row: 2; }
  </style>
</head>
<body>

<h1>🐔 Cross the Road</h1>

<div class="hud">
  <span id="hLives">❤️❤️❤️</span>
  <span id="hScore">Score: 0</span>
  <span id="hLevel">Level 1</span>
  <span id="hBest">Best: 0</span>
</div>

<canvas id="c"></canvas>

<p class="hint">Arrow keys or WASD to move &nbsp;·&nbsp; R to restart</p>

<div class="dpad">
  <button class="d-up"    ontouchstart="e(event);tap(0,-1)">▲</button>
  <button class="d-left"  ontouchstart="e(event);tap(-1,0)">◀</button>
  <button class="d-down"  ontouchstart="e(event);tap(0,1)">▼</button>
  <button class="d-right" ontouchstart="e(event);tap(1,0)">▶</button>
</div>

<script>
// ── Setup ─────────────────────────────────────────────────────────────────────
const CELL = 50, COLS = 13, ROWS = 13;
const W = COLS * CELL, H = ROWS * CELL;

const cv = document.getElementById('c');
const cx = cv.getContext('2d');
cv.width = W; cv.height = H;

// Row 0 = top (goal), Row 12 = bottom (start safe zone)
// Row types: 'goal' | 'road' | 'median' | 'safe'
const RTYPE = [
  'goal',
  'road','road','road','road','road',
  'median',
  'road','road','road','road','road',
  'safe'
];
// Traffic direction per row (1=right, -1=left, 0=none)
const RDIR = [0, 1,-1,1,-1,1, 0, -1,1,-1,1,-1, 0];

const CAR_COLORS = [
  '#e53935','#fb8c00','#fdd835','#43a047',
  '#1e88e5','#8e24aa','#00acc1','#e91e63',
  '#ff7043','#26c6da','#7cb342'
];

// ── State ─────────────────────────────────────────────────────────────────────
let G = {};

function init() {
  G = {
    px: Math.floor(COLS / 2),  // player column
    py: ROWS - 1,              // player row
    cars: makeCars(1),
    lives: 3,
    score: 0,
    lvl: 1,
    phase: 'play',   // 'play' | 'dead' | 'win' | 'over'
    deadT: 0,
    winT: 0,
    hi: +(localStorage.getItem('ctr_road_hi') || 0),
  };
}

function makeCars(lvl) {
  const out = [];
  const roadRows = [1,2,3,4,5,7,8,9,10,11];
  roadRows.forEach(row => {
    const dir = RDIR[row];
    const count = lvl >= 4 ? 3 : 2;
    const baseSpd = (0.055 + Math.random() * 0.05) * Math.min(1 + (lvl - 1) * 0.2, 3.2);
    for (let i = 0; i < count; i++) {
      const cw = (1.7 + Math.random() * 1.3) * CELL;
      const gap = W / count;
      out.push({
        row, dir,
        x: dir === 1 ? i * gap : W - i * gap - cw,
        w: cw,
        spd: baseSpd * dir,   // px / ms
        col: CAR_COLORS[Math.floor(Math.random() * CAR_COLORS.length)],
      });
    }
  });
  return out;
}

// ── Update ────────────────────────────────────────────────────────────────────
function update(dt) {
  if (G.phase === 'dead') {
    G.deadT -= dt;
    if (G.deadT <= 0) {
      if (G.lives <= 0) { G.phase = 'over'; return; }
      G.px = Math.floor(COLS / 2);
      G.py = ROWS - 1;
      G.phase = 'play';
    }
    return;
  }

  if (G.phase === 'win') {
    G.winT -= dt;
    if (G.winT <= 0) {
      G.lvl++;
      G.px = Math.floor(COLS / 2);
      G.py = ROWS - 1;
      G.cars = makeCars(G.lvl);
      G.phase = 'play';
    }
    return;
  }

  if (G.phase !== 'play') return;

  // Move cars & wrap
  G.cars.forEach(c => {
    c.x += c.spd * dt;
    if (c.dir ===  1 && c.x > W)          c.x = -c.w;
    if (c.dir === -1 && c.x + c.w < 0)    c.x = W;
  });

  // Continuous collision check while player stands on a road row
  if (RTYPE[G.py] === 'road') hitTest();
}

function hitTest() {
  const px1 = G.px * CELL + CELL * 0.13;
  const px2 = G.px * CELL + CELL * 0.87;
  for (const c of G.cars) {
    if (c.row !== G.py) continue;
    if (px1 < c.x + c.w - 4 && px2 > c.x + 4) { die(); return; }
  }
}

function die() {
  G.lives--;
  G.phase = 'dead';
  G.deadT = 1400;
}

// ── Movement ──────────────────────────────────────────────────────────────────
function move(dc, dr) {
  if (G.phase === 'over') { init(); return; }
  if (G.phase !== 'play') return;

  const nx = Math.max(0, Math.min(COLS - 1, G.px + dc));
  const ny = G.py + dr;
  if (ny < 0 || ny >= ROWS) return;

  G.px = nx;
  G.py = ny;

  if (ny === 0) {
    const pts = 10 * G.lvl;
    G.score += pts;
    if (G.score > G.hi) {
      G.hi = G.score;
      localStorage.setItem('ctr_road_hi', G.hi);
    }
    G.phase = 'win';
    G.winT = 1900;
    return;
  }

  if (RTYPE[ny] === 'road') hitTest();
}

// ── Draw ──────────────────────────────────────────────────────────────────────
function draw() {
  for (let r = 0; r < ROWS; r++) drawRow(r);
  G.cars.forEach(drawCar);
  drawPlayer();
  if (G.phase === 'win')  drawWinScreen();
  if (G.phase === 'over') drawOverScreen();
  updateHUD();
}

function drawRow(r) {
  const y = r * CELL;
  const t = RTYPE[r];

  if (t === 'goal') {
    cx.fillStyle = '#1b5e20';
    cx.fillRect(0, y, W, CELL);
    cx.fillStyle = '#2e7d32';
    for (let c = 0; c < COLS; c++) cx.fillRect(c * CELL + 2, y + 2, CELL - 4, CELL - 4);
    cx.font = 'bold 13px system-ui';
    cx.fillStyle = '#a5d6a7';
    cx.textAlign = 'center';
    cx.textBaseline = 'middle';
    cx.fillText('🏁  G O A L  🏁', W / 2, y + CELL / 2);

  } else if (t === 'median') {
    cx.fillStyle = '#2e7d32';
    cx.fillRect(0, y, W, CELL);
    cx.fillStyle = '#388e3c';
    for (let c = 0; c < COLS; c++) {
      blade(c * CELL + 5,  y + 8,  7, 15);
      blade(c * CELL + 20, y + 5,  7, 20);
      blade(c * CELL + 36, y + 10, 7, 12);
    }

  } else if (t === 'safe') {
    cx.fillStyle = '#33691e';
    cx.fillRect(0, y, W, CELL);
    cx.fillStyle = '#558b2f';
    for (let c = 0; c < COLS; c++) {
      blade(c * CELL + 6,  y + 6,  7, 17);
      blade(c * CELL + 22, y + 4,  7, 20);
      blade(c * CELL + 38, y + 8,  7, 14);
    }
    cx.font = 'bold 11px system-ui';
    cx.fillStyle = 'rgba(255,255,255,0.18)';
    cx.textAlign = 'center';
    cx.textBaseline = 'middle';
    cx.fillText('S T A R T', W / 2, y + CELL / 2);

  } else {
    // Road
    cx.fillStyle = r % 2 === 0 ? '#37474f' : '#263238';
    cx.fillRect(0, y, W, CELL);

    // Dashed centre line
    cx.strokeStyle = 'rgba(255,255,200,0.2)';
    cx.lineWidth = 2;
    cx.setLineDash([22, 18]);
    cx.beginPath(); cx.moveTo(0, y + CELL / 2); cx.lineTo(W, y + CELL / 2); cx.stroke();
    cx.setLineDash([]);

    // Row divider
    cx.strokeStyle = 'rgba(255,255,255,0.06)';
    cx.lineWidth = 1;
    cx.beginPath(); cx.moveTo(0, y); cx.lineTo(W, y); cx.stroke();

    // Subtle direction hint arrows
    cx.fillStyle = 'rgba(255,255,255,0.055)';
    cx.font = '20px system-ui';
    cx.textAlign = 'center';
    cx.textBaseline = 'middle';
    const arrow = RDIR[r] === 1 ? '›' : '‹';
    for (let c = 1; c < COLS; c += 3) cx.fillText(arrow, c * CELL + CELL / 2, y + CELL / 2);
  }
}

// Small grass blade helper
function blade(x, y, w, h) {
  cx.fillRect(x, y, w, h);
}

function drawCar({ row, x, w, col, dir }) {
  const y = row * CELL;
  const pad = 5, h = CELL, bh = h - pad * 2, br = 7;

  // Drop shadow
  cx.fillStyle = 'rgba(0,0,0,0.28)';
  rrect(x + pad + 2, y + pad + 3, w - pad * 2, bh, br);
  cx.fill();

  // Body
  cx.fillStyle = col;
  rrect(x + pad, y + pad, w - pad * 2, bh, br);
  cx.fill();

  // Roof
  const rfx = x + pad + w * 0.18, rfw = w * 0.64;
  const rfy = y + pad + bh * 0.07, rfh = bh * 0.44;
  cx.fillStyle = darken(col, 38);
  rrect(rfx, rfy, rfw, rfh, 5);
  cx.fill();

  // Windows
  const wy = rfy + 3, wh = rfh - 6;
  cx.fillStyle = 'rgba(180,225,255,0.88)';
  cx.fillRect(rfx + 4,         wy, rfw * 0.43, wh);
  cx.fillRect(rfx + rfw * 0.55, wy, rfw * 0.42, wh);

  // Headlights (front) & taillights (back)
  const frontX = dir === 1 ? x + w - pad - 7 : x + pad + 2;
  const backX  = dir === 1 ? x + pad + 2      : x + w - pad - 7;
  cx.fillStyle = '#fffde7';
  cx.fillRect(frontX, y + h * 0.33, 5, 6);
  cx.fillRect(frontX, y + h * 0.62, 5, 6);
  cx.fillStyle = '#f44336';
  cx.fillRect(backX, y + h * 0.33, 5, 6);
  cx.fillRect(backX, y + h * 0.62, 5, 6);

  // Wheels
  cx.fillStyle = '#111';
  wdot(x + pad + w * 0.22, y + h - pad - 3, 5);
  wdot(x + pad + w * 0.78, y + h - pad - 3, 5);
}

function drawPlayer() {
  const x = G.px * CELL, y = G.py * CELL;

  if (G.phase === 'dead') {
    if (Math.floor(G.deadT / 140) % 2 === 0) {
      cx.font = `${CELL * 0.78}px serif`;
      cx.textAlign = 'center';
      cx.textBaseline = 'middle';
      cx.fillText('💥', x + CELL / 2, y + CELL / 2);
    }
    return;
  }

  // Glow when on a road
  if (RTYPE[G.py] === 'road') {
    cx.shadowColor = 'rgba(255,255,120,0.65)';
    cx.shadowBlur = 18;
  }
  cx.font = `${CELL * 0.72}px serif`;
  cx.textAlign = 'center';
  cx.textBaseline = 'middle';
  cx.fillText('🐔', x + CELL / 2, y + CELL / 2);
  cx.shadowBlur = 0;
}

function drawWinScreen() {
  overlay(0.65);
  cx.textAlign = 'center';
  cx.textBaseline = 'middle';
  cx.font = 'bold 44px system-ui';
  cx.fillStyle = '#69f0ae';
  cx.fillText('YOU MADE IT! 🎉', W / 2, H / 2 - 34);
  cx.font = '22px system-ui';
  cx.fillStyle = '#fff';
  cx.fillText(`+${10 * G.lvl} points`, W / 2, H / 2 + 16);
  cx.font = '16px system-ui';
  cx.fillStyle = 'rgba(255,255,255,0.55)';
  cx.fillText(`Level ${G.lvl + 1} incoming…`, W / 2, H / 2 + 58);
}

function drawOverScreen() {
  overlay(0.78);
  cx.textAlign = 'center';
  cx.textBaseline = 'middle';
  cx.font = 'bold 52px system-ui';
  cx.fillStyle = '#ff5252';
  cx.fillText('GAME OVER', W / 2, H / 2 - 55);
  cx.font = '26px system-ui';
  cx.fillStyle = '#fff';
  cx.fillText(`Score: ${G.score}`, W / 2, H / 2 + 8);
  cx.fillText(`Best:  ${G.hi}`,   W / 2, H / 2 + 48);
  cx.font = '17px system-ui';
  cx.fillStyle = 'rgba(255,255,255,0.48)';
  cx.fillText('Press R or any arrow to play again', W / 2, H / 2 + 100);
}

function updateHUD() {
  document.getElementById('hLives').textContent = '❤️'.repeat(Math.max(0, G.lives)) || '💀';
  document.getElementById('hScore').textContent = `Score: ${G.score}`;
  document.getElementById('hLevel').textContent = `Level ${G.lvl}`;
  document.getElementById('hBest').textContent  = `Best: ${G.hi}`;
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function rrect(x, y, w, h, r) {
  cx.beginPath();
  cx.moveTo(x + r, y);
  cx.lineTo(x + w - r, y);
  cx.quadraticCurveTo(x + w, y, x + w, y + r);
  cx.lineTo(x + w, y + h - r);
  cx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  cx.lineTo(x + r, y + h);
  cx.quadraticCurveTo(x, y + h, x, y + h - r);
  cx.lineTo(x, y + r);
  cx.quadraticCurveTo(x, y, x + r, y);
  cx.closePath();
}

function wdot(x, y, r) {
  cx.beginPath(); cx.arc(x, y, r, 0, Math.PI * 2); cx.fill();
}

function darken(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, (n >> 16) - amt);
  const gr = Math.max(0, ((n >> 8) & 255) - amt);
  const b = Math.max(0, (n & 255) - amt);
  return `rgb(${r},${gr},${b})`;
}

function overlay(alpha) {
  cx.fillStyle = `rgba(0,0,0,${alpha})`;
  cx.fillRect(0, 0, W, H);
}

// ── Input ─────────────────────────────────────────────────────────────────────
const held = new Set();

document.addEventListener('keydown', ev => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(ev.key)) ev.preventDefault();
  if (held.has(ev.key)) return;
  held.add(ev.key);
  switch (ev.key) {
    case 'ArrowUp':    case 'w': case 'W': move( 0, -1); break;
    case 'ArrowDown':  case 's': case 'S': move( 0,  1); break;
    case 'ArrowLeft':  case 'a': case 'A': move(-1,  0); break;
    case 'ArrowRight': case 'd': case 'D': move( 1,  0); break;
    case 'r': case 'R': init(); break;
  }
});

document.addEventListener('keyup', ev => held.delete(ev.key));

function e(ev) { ev.preventDefault(); }  // prevent scroll on touch
function tap(dc, dr) {
  if (G.phase === 'over') { init(); return; }
  move(dc, dr);
}

// ── Game Loop ─────────────────────────────────────────────────────────────────
let lt = 0;

function loop(ts) {
  const dt = Math.min(ts - lt, 50);  // cap delta to 50ms
  lt = ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

init();
requestAnimationFrame(loop);
</script>
</body>
</html>
