<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlightWatch — Live Flight Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0d1117;
            color: #e6edf3;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Header ── */
        #header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
            z-index: 1000;
            flex-shrink: 0;
        }

        #header h1 {
            font-size: 18px;
            font-weight: 700;
            color: #58a6ff;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }

        #search {
            flex: 1;
            max-width: 280px;
            padding: 7px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #e6edf3;
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s;
        }
        #search:focus { border-color: #58a6ff; }
        #search::placeholder { color: #6e7681; }

        #refresh-btn {
            padding: 7px 14px;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #e6edf3;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s;
        }
        #refresh-btn:hover   { background: #30363d; }
        #refresh-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        #status {
            font-size: 12px;
            color: #6e7681;
            white-space: nowrap;
            margin-left: auto;
        }
        #status.loading { color: #58a6ff; }
        #status.error   { color: #f85149; }

        /* ── Map area ── */
        #main {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #map { width: 100%; height: 100%; }

        /* ── Loading spinner ── */
        #loading-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(13, 17, 23, 0.65);
            z-index: 999;
        }
        #loading-overlay.hidden { display: none; }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #30363d;
            border-top-color: #58a6ff;
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Flight detail panel ── */
        #flight-panel {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 280px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            z-index: 1000;
            overflow: hidden;
            transform: translateX(320px);
            transition: transform 0.25s ease;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        #flight-panel.open { transform: translateX(0); }

        #panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background: #21262d;
            border-bottom: 1px solid #30363d;
        }

        #panel-callsign {
            font-size: 20px;
            font-weight: 700;
            color: #58a6ff;
            letter-spacing: 1.5px;
        }

        #panel-close {
            background: none;
            border: none;
            color: #6e7681;
            font-size: 16px;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
        }
        #panel-close:hover { color: #e6edf3; background: #30363d; }

        #panel-body { padding: 12px 14px; }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #21262d;
            font-size: 13px;
        }
        .detail-row:last-child { border-bottom: none; }

        .detail-label {
            color: #6e7681;
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: 0.8px;
        }

        .detail-value {
            color: #e6edf3;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
        }
        .detail-value.climbing   { color: #3fb950; }
        .detail-value.descending { color: #f85149; }
        .detail-value.on-ground  { color: #d29922; }

        #countdown {
            font-size: 11px;
            color: #6e7681;
            padding: 8px 14px;
            border-top: 1px solid #30363d;
            text-align: center;
        }

        /* ── Leaflet overrides ── */
        .leaflet-control-attribution {
            background: rgba(13,17,23,0.8) !important;
            color: #6e7681 !important;
        }
        .leaflet-control-attribution a { color: #58a6ff !important; }

        .plane-tooltip {
            background: rgba(22,27,34,0.92);
            border: 1px solid #30363d;
            color: #e6edf3;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 4px;
            letter-spacing: 0.5px;
            box-shadow: none;
        }
        .leaflet-tooltip.plane-tooltip::before { border-top-color: #30363d; }
    </style>
</head>
<body>

<div id="header">
    <h1>✈ FlightWatch</h1>
    <input type="text" id="search" placeholder="Filter by callsign…" autocomplete="off" spellcheck="false" />
    <button id="refresh-btn">Refresh</button>
    <span id="status">Initializing…</span>
</div>

<div id="main">
    <div id="map"></div>

    <div id="loading-overlay">
        <div class="spinner"></div>
    </div>

    <div id="flight-panel">
        <div id="panel-header">
            <span id="panel-callsign">—</span>
            <button id="panel-close" title="Close">✕</button>
        </div>
        <div id="panel-body"></div>
        <div id="countdown"></div>
    </div>
</div>

<script>
// ─────────────────────────────────────────────
//  Config
// ─────────────────────────────────────────────
const OPENSKY_BASE = 'https://opensky-network.org/api/states/all';
const CORS_PROXY   = 'https://api.allorigins.win/raw?url=';
const REFRESH_MS  = 60_000;  // 60 s between auto-refreshes (respect rate limits)
const TIMEOUT_MS  = 15_000;

// OpenSky state-vector field indices — see CLAUDE.md for full reference
const F = {
    ICAO24:       0,
    CALLSIGN:     1,
    COUNTRY:      2,
    TIME_POS:     3,
    LAST_CONTACT: 4,
    LON:          5,
    LAT:          6,
    BARO_ALT:     7,   // metres
    ON_GROUND:    8,
    VELOCITY:     9,   // m/s
    HEADING:      10,  // degrees true, 0 = north
    VERT_RATE:    11,  // m/s, positive = climbing
    GEO_ALT:      13,  // metres
    SQUAWK:       14,
};

// ─────────────────────────────────────────────
//  App state
// ─────────────────────────────────────────────
let map;
let flightData   = {};   // icao24 → { marker, state }
let selectedIcao = null;
let refreshTimer;
let countdownTimer;
let nextRefresh;

// ─────────────────────────────────────────────
//  Map initialisation
// ─────────────────────────────────────────────
function initMap() {
    map = L.map('map', { zoomControl: true }).setView([39.5, -98.35], 5);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors ' +
            '&copy; <a href="https://carto.com">CARTO</a>',
        maxZoom: 18,
    }).addTo(map);

    map.on('moveend', fetchFlights);
    map.on('click', () => {
        if (document.getElementById('flight-panel').classList.contains('open')) closePanel();
    });

    fetchFlights();
}

// ─────────────────────────────────────────────
//  Plane SVG icon (rotated by heading)
// ─────────────────────────────────────────────
function planeIconHTML(heading, selected) {
    const color = selected ? '#ffd700' : '#58a6ff';
    const glow  = selected ? 'drop-shadow(0 0 5px rgba(255,215,0,0.8))' : 'none';
    return `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28"
                 style="filter:${glow};display:block;">
        <g transform="rotate(${heading ?? 0},14,14)">
            <polygon points="14,2 10,14 4,14 6,17 11,17 9,26 14,24 19,26 17,17 22,17 24,14 18,14"
                     fill="${color}" stroke="rgba(0,0,0,0.45)" stroke-width="1"/>
        </g>
    </svg>`;
}

function makePlaneIcon(heading, selected) {
    return L.divIcon({
        html:       planeIconHTML(heading, selected),
        className:  '',
        iconSize:   [28, 28],
        iconAnchor: [14, 14],
    });
}

// ─────────────────────────────────────────────
//  API fetch
// ─────────────────────────────────────────────
async function fetchFlights() {
    const bounds = map.getBounds();
    const params = new URLSearchParams({
        lamin: bounds.getSouth().toFixed(4),
        lomin: bounds.getWest().toFixed(4),
        lamax: bounds.getNorth().toFixed(4),
        lomax: bounds.getEast().toFixed(4),
    });

    setStatus('loading', 'Fetching flights…');
    document.getElementById('refresh-btn').disabled = true;

    const controller = new AbortController();
    const timeoutId  = setTimeout(() => controller.abort(), TIMEOUT_MS);

    try {
        const targetUrl = encodeURIComponent(`${OPENSKY_BASE}?${params}`);
        const res = await fetch(`${CORS_PROXY}${targetUrl}`, {
            signal: controller.signal,
        });

        if (res.status === 429) throw new Error('Rate limited — wait a moment and refresh');
        if (!res.ok)            throw new Error(`API error ${res.status}`);

        const data   = await res.json();
        const states = data.states || [];
        renderFlights(states);

        const n = states.length;
        setStatus('', `${n} flight${n !== 1 ? 's' : ''} • ${new Date().toLocaleTimeString()}`);
    } catch (err) {
        const msg = err.name === 'AbortError' ? 'Request timed out' : err.message;
        setStatus('error', msg);
    } finally {
        document.getElementById('refresh-btn').disabled = false;
        document.getElementById('loading-overlay').classList.add('hidden');
        scheduleRefresh();
    }
}

// ─────────────────────────────────────────────
//  Render / update markers
// ─────────────────────────────────────────────
function renderFlights(states) {
    const searchVal    = document.getElementById('search').value.trim().toUpperCase();
    const visibleIcaos = new Set();

    states.forEach(state => {
        const icao     = state[F.ICAO24];
        const callsign = (state[F.CALLSIGN] || '').trim();
        const lat      = state[F.LAT];
        const lon      = state[F.LON];

        if (!lat || !lon) return;

        if (searchVal) {
            if (!callsign.toUpperCase().includes(searchVal) &&
                !icao.toUpperCase().includes(searchVal)) return;
        }

        visibleIcaos.add(icao);
        const heading    = state[F.HEADING];
        const isSelected = icao === selectedIcao;

        if (flightData[icao]?.marker) {
            flightData[icao].marker.setLatLng([lat, lon]);
            flightData[icao].marker.setIcon(makePlaneIcon(heading, isSelected));
            flightData[icao].state = state;
        } else {
            const marker = L.marker([lat, lon], { icon: makePlaneIcon(heading, isSelected) });
            marker.bindTooltip(callsign || icao.toUpperCase(), {
                permanent:  false,
                direction:  'top',
                className:  'plane-tooltip',
            });
            marker.on('click', e => { L.DomEvent.stopPropagation(e); selectFlight(icao); });
            marker.addTo(map);
            flightData[icao] = { marker, state };
        }
    });

    // Remove markers for flights that left the view or no longer match the filter
    Object.keys(flightData).forEach(icao => {
        if (!visibleIcaos.has(icao)) {
            flightData[icao].marker.remove();
            delete flightData[icao];
            if (icao === selectedIcao) closePanel();
        }
    });

    // Keep detail panel current if the selected flight was refreshed
    if (selectedIcao && flightData[selectedIcao]) renderPanel(selectedIcao);
}

// ─────────────────────────────────────────────
//  Flight selection & detail panel
// ─────────────────────────────────────────────
function selectFlight(icao) {
    if (selectedIcao && flightData[selectedIcao]) {
        const prev = flightData[selectedIcao];
        prev.marker.setIcon(makePlaneIcon(prev.state[F.HEADING], false));
    }
    selectedIcao = icao;
    if (flightData[icao]) {
        flightData[icao].marker.setIcon(
            makePlaneIcon(flightData[icao].state[F.HEADING], true)
        );
    }
    renderPanel(icao);
}

function renderPanel(icao) {
    const entry = flightData[icao];
    if (!entry) return;
    const s        = entry.state;
    const callsign = (s[F.CALLSIGN] || '').trim() || s[F.ICAO24].toUpperCase();
    const onGround = s[F.ON_GROUND];

    const altFt  = s[F.BARO_ALT] != null
        ? Math.round(s[F.BARO_ALT] * 3.28084).toLocaleString() + ' ft'
        : 'N/A';
    const speedKt = s[F.VELOCITY] != null
        ? Math.round(s[F.VELOCITY] * 1.94384) + ' kts'
        : 'N/A';

    let vertLabel = 'Level';
    let vertClass = '';
    const vr = s[F.VERT_RATE];
    if (vr != null) {
        if (vr >  0.5) { vertLabel = '▲ Climbing';   vertClass = 'climbing';   }
        if (vr < -0.5) { vertLabel = '▼ Descending'; vertClass = 'descending'; }
    }

    const heading = s[F.HEADING] != null ? Math.round(s[F.HEADING]) + '°' : 'N/A';
    const squawk  = s[F.SQUAWK] || 'N/A';

    const rows = [
        ['Country',  s[F.COUNTRY] || 'Unknown',                   ''],
        ['ICAO24',   s[F.ICAO24].toUpperCase(),                   ''],
        ['Altitude', onGround ? '—' : altFt,     onGround ? 'on-ground' : ''],
        ['Speed',    onGround ? '—' : speedKt,   onGround ? 'on-ground' : ''],
        ['Heading',  heading,                                      ''],
        ['Vertical', onGround ? 'On Ground' : vertLabel, onGround ? 'on-ground' : vertClass],
        ['Squawk',   squawk,                                       ''],
    ];

    document.getElementById('panel-callsign').textContent = callsign;
    document.getElementById('panel-body').innerHTML = rows.map(([label, value, cls]) =>
        `<div class="detail-row">
            <span class="detail-label">${label}</span>
            <span class="detail-value ${cls}">${value}</span>
        </div>`
    ).join('');

    document.getElementById('flight-panel').classList.add('open');
}

function closePanel() {
    document.getElementById('flight-panel').classList.remove('open');
    if (selectedIcao && flightData[selectedIcao]) {
        flightData[selectedIcao].marker.setIcon(
            makePlaneIcon(flightData[selectedIcao].state[F.HEADING], false)
        );
    }
    selectedIcao = null;
}

// ─────────────────────────────────────────────
//  Auto-refresh with countdown
// ─────────────────────────────────────────────
function scheduleRefresh() {
    clearTimeout(refreshTimer);
    clearInterval(countdownTimer);
    nextRefresh = Date.now() + REFRESH_MS;

    countdownTimer = setInterval(() => {
        const secs = Math.max(0, Math.ceil((nextRefresh - Date.now()) / 1000));
        document.getElementById('countdown').textContent = `Auto-refresh in ${secs}s`;
    }, 1000);

    refreshTimer = setTimeout(() => {
        clearInterval(countdownTimer);
        fetchFlights();
    }, REFRESH_MS);
}

// ─────────────────────────────────────────────
//  Helpers
// ─────────────────────────────────────────────
function setStatus(type, msg) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className   = type;
}

// ─────────────────────────────────────────────
//  Event wiring
// ─────────────────────────────────────────────
document.getElementById('refresh-btn').addEventListener('click', () => {
    clearTimeout(refreshTimer);
    clearInterval(countdownTimer);
    fetchFlights();
});

document.getElementById('panel-close').addEventListener('click', closePanel);

// Re-filter already-loaded markers without a new API call
document.getElementById('search').addEventListener('input', () => {
    const states = Object.values(flightData).map(d => d.state);
    renderFlights(states);
});

// ─────────────────────────────────────────────
//  Boot
// ─────────────────────────────────────────────
initMap();
</script>
</body>
</html>
